
services:
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "8001:8001"
    networks:
      - coworking-network

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
    ports:
      - "8002:8002"
    depends_on:
      - catalog-service
    networks:
      - coworking-network

networks:
  coworking-network:
    driver: bridge
