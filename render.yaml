services:
  - type: web
    name: catalog-service
    env: python
    plan: free
    rootDir: catalog-service
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: ORDERS_SERVICE_URL
        value: http://orders-service:10000

  - type: web
    name: orders-service
    env: python
    plan: free
    rootDir: orders-service
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: CATALOG_SERVICE_URL
        value: http://catalog-service:10000
